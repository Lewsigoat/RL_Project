  download_concurrency: 8
  license: "CC-BY-4.0"

corpus:
  contract_metadata_coverage_target: 0.95
  resolution_coverage_target: 0.95
  partition_rows: 250000
  retain_wallets: false
  derive_prices_from_trades: true

model:
  random_seed: 20260910
  text_max_features: 20000
  text_min_document_frequency: 2
  logistic_c_values: [0.01, 0.1, 1.0, 10.0]
  residual_l2_values: [0.1, 1.0, 10.0, 100.0]
  boosting_learning_rates: [0.02, 0.05]
  boosting_leaf_nodes: [15, 31]
  ensemble_minimum_brier_gain: 0.001
  category_prior_strength: 20.0
  probability_clip: 0.000001

inference:
  alpha: 0.05
  minimum_practical_effect: 0.005
  bootstrap_repetitions: 9999
  block_length_weeks: 4
  robustness_block_lengths_weeks: [2, 8, 13]
  power_repetitions: 5000
  target_power: 0.90
  minimum_effective_weeks: 30

paths:
