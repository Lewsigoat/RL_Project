  full_inventory: true
  max_markets: null
  request_timeout_seconds: 30
  max_retries: 4
  concurrency: 12
  price_fidelity_minutes: 60
  history_lookback_days: 45
  monthly_stratified_sampling: false
  sampling_order: "endDate"
  collect_trades: true
  trade_page_size: 10000
  user_agent: "polymarket-forecast-study/0.2 (+research)"

historical:
  enabled: true
  repository: "TimeSeventeen/Polymarket-v1"
  revision: "5aa1b9d52316a8b2e789e81c8ae42c7ed532e8aa"
  layer: "daily_aligned"
  additional_layers: ["daily_aligned_multi"]
  start_date: "2022-11-21T00:00:00Z"
